name: studyos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyos}
      POSTGRES_DB: ${POSTGRES_DB:-studyos}
    # Loopback only. The API and the migrate job reach db over the Compose
    # network; the host mapping exists purely for local tooling (psql, alembic
    # outside the stack) and must not listen on the public interfaces.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyos} -d ${POSTGRES_DB:-studyos}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Deploy-time migration job. Migrations run once, as their own step, before
  # any API replica starts; they are not run on every boot (that races across
  # replicas). The entrypoint performs the `upgrade head`; `alembic current`
  # afterwards prints the head revision for the deploy log and makes the job
  # exit cleanly.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://studyos:studyos@db:5432/studyos}
      RUN_MIGRATIONS: "true"
    command: ["alembic", "current"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://studyos:studyos@db:5432/studyos}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgresql+asyncpg://studyos:studyos@db:5432/postgres}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_NAME: ${COOKIE_NAME:-studyos_session}
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Migrations are a deploy-time step owned by the `migrate` service; a
      # replica must not race to migrate on boot.
      RUN_MIGRATIONS: "false"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Drains the execution queue. It is a separate service for the same reason the
  # sandbox is a separate backend: the process that reaches the isolation
  # boundary is not the process that answers HTTP. It shares the upload volume
  # because it reads a job's stored source and writes its artifacts through the
  # same storage abstraction.
  #
  # EXECUTION_BACKEND defaults to `disabled`, under which every job is rejected.
  # Enabling real execution (`docker`) means giving this process access to a
  # Docker daemon — a deliberate, separate decision. Do NOT mount the host
  # socket into the `api` service; if you enable execution, give the daemon
  # access here and nowhere else, and prefer a rootless or remote endpoint via
  # EXECUTION_DOCKER_HOST over the host socket.
  execution-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.modules.execution.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://studyos:studyos@db:5432/studyos}
      UPLOAD_DIR: /app/data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Migrations are owned by the `migrate` service; the worker must not race.
      RUN_MIGRATIONS: "false"
      EXECUTION_WORKER_ID: ${EXECUTION_WORKER_ID:-execution-worker}
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-disabled}
      EXECUTION_DOCKER_HOST: ${EXECUTION_DOCKER_HOST:-}
      EXECUTION_ALLOWED_IMAGES: ${EXECUTION_ALLOWED_IMAGES:-}
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
