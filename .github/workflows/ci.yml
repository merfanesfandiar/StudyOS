name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyos
          POSTGRES_PASSWORD: studyos
          POSTGRES_DB: studyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyos -d studyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite httpx mypy pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check app tests alembic

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -q

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://studyos:studyos@localhost:5432/studyos
        run: alembic upgrade head

      - name: Migration round trip
        env:
          DATABASE_URL: postgresql+asyncpg://studyos:studyos@localhost:5432/studyos
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Migration preserves a populated database
        env:
          DATABASE_URL: postgresql+asyncpg://studyos:studyos@localhost:5432/studyos
        run: |
          set -euo pipefail
          alembic downgrade 0001_initial
          psql "postgresql://studyos:studyos@localhost:5432/studyos" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, name, email, password_hash)
          VALUES ('11111111-1111-1111-1111-111111111111', 'Legacy', 'legacy@example.com', 'x');
          INSERT INTO workspaces (id, name, owner_id)
          VALUES ('22222222-2222-2222-2222-222222222222', 'Legacy', '11111111-1111-1111-1111-111111111111');
          INSERT INTO workspace_members (workspace_id, user_id, role)
          VALUES ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', 'OWNER');
          INSERT INTO courses (id, workspace_id, name, code)
          VALUES ('44444444-4444-4444-4444-444444444444', '22222222-2222-2222-2222-222222222222', 'Legacy course', 'LEG1');
          INSERT INTO assignments (id, workspace_id, course_id, title, status)
          VALUES ('55555555-5555-5555-5555-555555555555', '22222222-2222-2222-2222-222222222222', '44444444-4444-4444-4444-444444444444', 'Legacy assignment', 'ACTIVE');
          SQL
          alembic upgrade head
          psql "postgresql://studyos:studyos@localhost:5432/studyos" -v ON_ERROR_STOP=1 -t -c \
            "SELECT status FROM assignments WHERE id = '55555555-5555-5555-5555-555555555555';" \
            | grep -q READY_FOR_ANALYSIS
          echo "Legacy ACTIVE row survived and mapped to READY_FOR_ANALYSIS"

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start the stack
        env:
          SEED_DEMO_DATA: "false"
        run: docker compose up -d --build db api

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the critical flow
        working-directory: apps/web
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run test:e2e

      - name: Logs on failure
        if: failure()
        run: docker compose logs api web

      - name: Stop the stack
        if: always()
        run: docker compose down -v
