name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyos
          POSTGRES_PASSWORD: studyos
          POSTGRES_DB: studyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyos -d studyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite httpx mypy pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check app tests alembic

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -q

      - name: Golden analysis evaluation
        # Runs with the deterministic mock provider, so no model credential is
        # needed. Fails the build if a fixture regresses or if the evaluation goes
        # blind, i.e. stops detecting a deliberately broken analysis.
        run: python -m app.ai.evaluation.report

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://studyos:studyos@localhost:5432/studyos
        run: alembic upgrade head

      - name: Migration round trip
        env:
          DATABASE_URL: postgresql+asyncpg://studyos:studyos@localhost:5432/studyos
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Migration preserves a populated database
        env:
          DATABASE_URL: postgresql+asyncpg://studyos:studyos@localhost:5432/studyos
        run: |
          set -euo pipefail
          alembic downgrade 0001_initial
          psql "postgresql://studyos:studyos@localhost:5432/studyos" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, name, email, password_hash)
          VALUES ('11111111-1111-1111-1111-111111111111', 'Legacy', 'legacy@example.com', 'x');
          INSERT INTO workspaces (id, name, owner_id)
          VALUES ('22222222-2222-2222-2222-222222222222', 'Legacy', '11111111-1111-1111-1111-111111111111');
          INSERT INTO workspace_members (workspace_id, user_id, role)
          VALUES ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', 'OWNER');
          INSERT INTO courses (id, workspace_id, name, code)
          VALUES ('44444444-4444-4444-4444-444444444444', '22222222-2222-2222-2222-222222222222', 'Legacy course', 'LEG1');
          INSERT INTO assignments (id, workspace_id, course_id, title, status)
          VALUES ('55555555-5555-5555-5555-555555555555', '22222222-2222-2222-2222-222222222222', '44444444-4444-4444-4444-444444444444', 'Legacy assignment', 'ACTIVE');
          SQL
          alembic upgrade head
          psql "postgresql://studyos:studyos@localhost:5432/studyos" -v ON_ERROR_STOP=1 -t -c \
            "SELECT status FROM assignments WHERE id = '55555555-5555-5555-5555-555555555555';" \
            | grep -q READY_FOR_ANALYSIS
          echo "Legacy ACTIVE row survived and mapped to READY_FOR_ANALYSIS"

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start the stack
        env:
          SEED_DEMO_DATA: "false"
        run: docker compose up -d --build db api

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the critical flow
        working-directory: apps/web
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run test:e2e

      - name: Logs on failure
        if: failure()
        run: docker compose logs api web

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  image:
    name: Container image
    # The web image is the one artefact nothing else in CI exercises: the other
    # jobs run `npm run build` and Playwright starts Next itself, so the image
    # could be broken and CI would stay green. It earns its place by checking the
    # part that is easy to get wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the web image
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: docker compose build web

      - name: The image serves its own stylesheet
        # `output: "standalone"` means the hashed assets are not in the server
        # bundle; the Dockerfile copies `.next/static` next to `server.js`, and if
        # that copy is dropped the container still starts, still returns 200 for
        # the HTML, and renders every page unstyled. Nothing else in CI would
        # notice. This is the check that does.
        run: |
          set -euo pipefail
          # --no-deps: `web` declares `depends_on: api: service_healthy`, and
          # standing that up would pull in the database and the API image too.
          # The login page is static and renders without either, which is the
          # point -- this job is about the image's own assets, not the stack.
          docker compose up -d --no-deps web
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login > /tmp/login.html; then
              break
            fi
            sleep 2
          done
          css=$(grep -oE '/_next/static/[^"]+\.css' /tmp/login.html | head -1)
          if [ -z "$css" ]; then
            echo "No stylesheet referenced by the served HTML"
            docker compose logs web
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$css")
          echo "$css -> $code"
          if [ "$code" != "200" ]; then
            echo "The container served the page without its CSS. The standalone"
            echo "asset copy in infrastructure/docker/web.Dockerfile has regressed."
            docker compose logs web
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs web

      - name: Stop the stack
        if: always()
        run: docker compose down -v
